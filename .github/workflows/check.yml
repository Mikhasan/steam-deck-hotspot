name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n install.sh && for script in src/*.sh; do bash -n "$script"; done
      - name: Installer tests
        run: python3 -m unittest discover -s tests -v
